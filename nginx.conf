events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Definitions (Load Balancer Pools)
    upstream nestjs_backend {
        least_conn;
        server nestjs-app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ui_user {
        server ui-user:3001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream ui_admin {
        server ui-admin:3002 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # -------------------------------------------------------------
    # 1. API Subdomain Server Block: api.gradmetric.me
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name api.gradmetric.me;

        # Health Check endpoint for probes
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare Edge Ingress Headers
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # -------------------------------------------------------------
    # 2. Admin Observability Console: logs.gradmetric.me
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name logs.gradmetric.me;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://ui_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # -------------------------------------------------------------
    # 3. User Frontend & Default Ingress: gradmetric.me, www, and Direct IP
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name gradmetric.me www.gradmetric.me _;

        # Health probe endpoint for Nginx and Docker
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx stub_status for connection metrics
        location /stub_status {
            stub_status on;
            access_log off;
        }

        # Direct API calls forwarded to NestJS (for direct IP testing)
        location ~ ^/(auth|admin|dashboard|blogs|analytics|health) {
            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
        }

        # User Community Blog Ingress
        location / {
            proxy_pass http://ui_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
