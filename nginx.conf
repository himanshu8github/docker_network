events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map_hash_bucket_size 128;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------
    # Cloudflare Real IP Module (Trust Cloudflare Edge Proxies)
    # -------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # -------------------------------------------------------------
    # Cloudflare Origin Secret Verification (Gitignored on Production)
    # -------------------------------------------------------------
    include /etc/nginx/origin_secret.conf;

    # Identify internal clients (localhost & Docker bridge network)
    geo $is_internal_client {
        default 0;
        127.0.0.1 1;
        172.16.0.0/12 1;
    }

    # Authorize if request has valid secret OR is an internal client
    map "$is_internal_client:$has_valid_secret" $is_authorized_request {
        "~^1:" 1; # Internal client (healthchecks, direct container calls)
        "0:1"  1; # Cloudflare request carrying matching X-Origin-Secret
        default 0;
    }

    # Upstream Definitions (Load Balancer Pools)
    upstream nestjs_backend {
        least_conn;
        server nestjs-app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ui_user {
        server ui-user:3001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream ui_admin {
        server ui-admin:3002 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # -------------------------------------------------------------
    # 1. API Subdomain Server Block: api.gradmetric.me
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name api.gradmetric.me;

        # Health Check endpoint for probes
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            if ($is_authorized_request = 0) {
                return 403 "Direct or unauthorized origin access forbidden\n";
            }

            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare Edge Ingress Headers
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # -------------------------------------------------------------
    # 2. Admin Observability Console: logs.gradmetric.me
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name logs.gradmetric.me;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            if ($is_authorized_request = 0) {
                return 403 "Direct or unauthorized origin access forbidden\n";
            }

            proxy_pass http://ui_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # -------------------------------------------------------------
    # 3. User Frontend & Default Ingress: gradmetric.me, www, and Direct IP
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name gradmetric.me www.gradmetric.me _;

        # Health probe endpoint for Nginx and Docker
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx stub_status for connection metrics (Internal & Local Only)
        location /stub_status {
            stub_status on;
            access_log off;

            # Allow local EC2 host and internal Docker bridge network
            allow 127.0.0.1;
            allow 172.16.0.0/12;

            # Reject all external public traffic with 403 Forbidden
            deny all;
        }

        # Direct API calls forwarded to NestJS (for direct IP testing)
        location ~ ^/(auth|admin|dashboard|blogs|analytics|health) {
            if ($is_authorized_request = 0) {
                return 403 "Direct or unauthorized origin access forbidden\n";
            }

            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
        }

        # User Community Blog Ingress
        location / {
            if ($is_authorized_request = 0) {
                return 403 "Direct or unauthorized origin access forbidden\n";
            }

            proxy_pass http://ui_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
