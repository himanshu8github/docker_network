events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Upstream Definitions
    upstream nestjs_backend {
        server nestjs-app:3000;
    }

    upstream ui_frontend {
        server ui-app:3001;
    }

    # 1. API Subdomain Server Block (e.g. api.yourdomain.tech)
    server {
        listen 80;
        server_name api.*;

        location / {
            proxy_pass http://nestjs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # 2. Main Frontend & Default Ingress Server Block (Root Domain & Direct IP)
    server {
        listen 80;
        server_name _;

        # Direct API calls forwarded to NestJS
        location /messages {
            proxy_pass http://nestjs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Frontend Ingress
        location / {
            proxy_pass http://ui_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
