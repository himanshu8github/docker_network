version: '3.8'

services:

  # 1. MySQL 8 Database Container (Persistent Volume + Healthcheck)
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # 2. NestJS Backend REST API (Internal Telemetry Prober + Host Telemetry)
  nestjs-app:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nestjs-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      PORT: ${PORT:-3000}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. User Community Blog Frontend (gradmetric.me / Port 3001)
  ui-user:
    build:
      context: ./ui
      dockerfile: Dockerfile.user
    container_name: ui-user
    restart: unless-stopped
    depends_on:
      nestjs-app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Admin Observability Console Frontend (logs.gradmetric.me / Port 3002)
  ui-admin:
    build:
      context: ./ui
      dockerfile: Dockerfile.admin
    container_name: ui-admin
    restart: unless-stopped
    depends_on:
      nestjs-app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/admin.html"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Nginx Reverse Proxy & Load Balancer (Ports 80 & 443 Ingress)
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./origin_secret.conf:/etc/nginx/origin_secret.conf:ro
    depends_on:
      nestjs-app:
        condition: service_healthy
      ui-user:
        condition: service_healthy
      ui-admin:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
