events {
    # Maximum number of simultaneous connections that each worker process can handle
    worker_connections 1024;
}

http {
    # Security: Hide Nginx version number from error pages and response headers
    server_tokens off;

    # 1. UPSTREAM POOL (Where Nginx forwards incoming traffic)
    # Inside Docker, Nginx resolves 'nestjs-app' via Docker DNS on the 'two-tier-net' network.
    upstream nestjs_backend {
        server nestjs-app:3000;
        # When we add a load balancer, we simply add more replicas here:
        # server nestjs-app-2:3000;
    }

    server {
        # Listen on standard web port 80 (HTTP)
        listen 80;

        # '_' is a wildcard catch-all that matches your EC2 Public IP (or any IP/domain)
        server_name _;

        # Route all incoming requests (/) to our NestJS upstream backend
        location / {
            # Forward the request to the upstream group defined above
            proxy_pass http://nestjs_backend;

            # HTTP headers forwarded to NestJS so it knows the real client details:
            # 1. Preserve the original Host header sent by the client
            proxy_set_header Host $host;

            # 2. Pass the real IP address of the user (not Nginx's internal IP)
            proxy_set_header X-Real-IP $remote_addr;

            # 3. List of IP addresses the request passed through
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 4. Tells NestJS whether the request was HTTP or HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts: wait up to 60s for NestJS to respond
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
