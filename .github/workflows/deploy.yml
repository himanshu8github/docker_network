name: Production Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Docker Network on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Deployment started on EC2..."
            
            # Navigate to project directory on EC2 (or clone if first time)
            if [ -d "$HOME/docker_network" ]; then
              cd $HOME/docker_network
              echo "Pulling latest changes from main branch..."
              git pull origin main
            else
              echo "Cloning repository..."
              git clone https://github.com/himanshu8github/docker_network.git $HOME/docker_network
              cd $HOME/docker_network
            fi

            # Rebuild and restart containers in background
            echo "Rebuilding and restarting Docker containers..."
            docker compose up -d --build

            # Clean up old unused dangling Docker images to save disk space
            echo "Pruning dangling Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
